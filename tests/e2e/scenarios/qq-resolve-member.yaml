id: qq-resolve-member
name: "查找群成员QQ号"
description: "用户请求通过昵称查找群成员 QQ 号，验证 qq_resolve_member 被调用"
tags:
  - resolve
  - basic

setup:
  agent_id: "test-bot"
  clean_before: true

turns:
  - role: user
    content: "请直接调用 qq_resolve_member 工具，在 group_id 为 1004131062 的群里查找昵称为 RickyHao 的成员QQ号"

graders:
  - type: tool_calls
    assertions:
      - tool: "qq_resolve_member"

cleanup:
  clean_agent_data: true
