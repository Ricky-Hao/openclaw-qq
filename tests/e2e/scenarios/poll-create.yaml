id: poll-create
name: "创建投票"
description: "用户请求在 QQ 群创建投票，验证 poll_create 被调用"
tags:
  - poll
  - basic

setup:
  agent_id: "test-bot"
  clean_before: true

turns:
  - role: user
    content: "请直接调用 poll_create 工具，参数 target 为 'qq:group:123456789'，question 为 '测试投票'，options 为 ['A', 'B', 'C']，duration 为 '1m'"

graders:
  - type: tool_calls
    assertions:
      - tool: "poll_create"
        params_contain:
          target: "qq:group:123456789"

cleanup:
  clean_agent_data: true
